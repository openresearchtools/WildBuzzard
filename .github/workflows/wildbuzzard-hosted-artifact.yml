name: WildBuzzard Ubuntu 24.04 hosted artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arti:
    name: Build pinned Arti runtime
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare Arti directories
        id: paths
        run: |
          set -Eeuo pipefail
          root="${RUNNER_TEMP}/wildbuzzard-arti-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "${root}/build" "${root}/stage"
          echo "root=${root}" >>"${GITHUB_OUTPUT}"

      - name: Checkout WildBuzzard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source/wildbuzzard
          fetch-depth: 1
          persist-credentials: false

      - name: Build pinned Arti runtime
        run: |
          set -Eeuo pipefail
          source_root="${GITHUB_WORKSPACE}/source/wildbuzzard"
          build_root="${{ steps.paths.outputs.root }}/build"
          stage="${{ steps.paths.outputs.root }}/stage"
          arti_commit="$(
            awk -F' = ' '$1 == "commit" { gsub(/^"|"$/, "", $2); print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml"
          )"
          arti_rust="$(
            awk -F' = ' '$1 == "build_rustc" { print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml" |
              sed -E 's/^"rustc ([0-9.]+).*/\1/'
          )"
          git -C "${source_root}" fetch --no-tags --depth=1 origin "${arti_commit}"
          rustup toolchain install "${arti_rust}" --profile minimal
          rustup default "${arti_rust}"
          "${source_root}/wildbuzzard/scripts/build-arti-runtime.sh" \
            --build-root "${build_root}"
          mapfile -d '' -t runs < <(
            find "${build_root}/runs" -mindepth 1 -maxdepth 1 -type d -print0
          )
          if ((${#runs[@]} != 1)); then
            echo "Expected one Arti build run, found ${#runs[@]}" >&2
            exit 1
          fi
          manifest="${runs[0]}/build-manifest.txt"
          manifest_value() {
            sed -n "s/^$1=//p" "${manifest}"
          }
          install -m 0755 -- "$(manifest_value artifact)" "${stage}/arti"
          install -m 0644 -- "$(manifest_value config)" "${stage}/arti.toml"
          install -m 0644 -- "$(manifest_value provenance)" "${stage}/arti-provenance.zip"
          install -m 0644 -- "${manifest}" "${stage}/arti-build-manifest.txt"

      - name: Upload pinned Arti runtime
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-arti-${{ github.sha }}
          path: ${{ steps.paths.outputs.root }}/stage/**
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload Arti build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-arti-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.root }}/build/**/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7

  browser:
    name: Build amd64 Debian artifact
    needs: arti
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare artifact directories
        id: paths
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/wildbuzzard-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "${release_root}/arti-input" "${release_root}/artifacts" "${release_root}/logs" "${release_root}/work"
          echo "WILDBUZZARD_RELEASE_ROOT=${release_root}" >>"${GITHUB_ENV}"
          echo "release_root=${release_root}" >>"${GITHUB_OUTPUT}"

      - name: Checkout WildBuzzard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source/wildbuzzard
          fetch-depth: 1
          persist-credentials: false

      - name: Download pinned Arti runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wildbuzzard-arti-${{ github.sha }}
          path: ${{ steps.paths.outputs.release_root }}/arti-input

      - name: Prepare browser toolchain
        run: |
          set -Eeuo pipefail
          source_root="${GITHUB_WORKSPACE}/source/wildbuzzard"
          arti_rust="$(
            awk -F' = ' '$1 == "build_rustc" { print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml" |
              sed -E 's/^"rustc ([0-9.]+).*/\1/'
          )"
          chmod 0755 "${WILDBUZZARD_RELEASE_ROOT}/arti-input/arti"
          rustup toolchain install "${arti_rust}" --profile minimal
          rustup default "${arti_rust}"
          export MOZBUILD_STATE_PATH="${WILDBUZZARD_RELEASE_ROOT}/work/browser/state"
          cd -- "${source_root}"
          ./mach --no-interactive bootstrap --application-choice browser \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/bootstrap.log"

      - name: Build and package directly on Ubuntu 24.04
        run: |
          set -Eeuo pipefail
          export CI=1
          export MOZBUILD_STATE_PATH="${WILDBUZZARD_RELEASE_ROOT}/work/browser/state"
          "${GITHUB_WORKSPACE}/source/wildbuzzard/wildbuzzard/ci/build-browser-artifact.sh" \
            --wildbuzzard "${GITHUB_WORKSPACE}/source/wildbuzzard" \
            --commit "${GITHUB_SHA}" \
            --work-dir "${WILDBUZZARD_RELEASE_ROOT}/work" \
            --artifact-dir "${WILDBUZZARD_RELEASE_ROOT}/artifacts" \
            --arti-dir "${WILDBUZZARD_RELEASE_ROOT}/arti-input" \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/browser-build.log"

      - name: Upload WildBuzzard Debian artifact and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-amd64-deb-${{ github.sha }}
          path: |
            ${{ steps.paths.outputs.release_root }}/artifacts/wildbuzzard_*_amd64.deb
            ${{ steps.paths.outputs.release_root }}/artifacts/*-build-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/browser-artifact-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload browser build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-browser-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.release_root }}/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
