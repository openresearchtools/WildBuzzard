name: WildBuzzard Ubuntu 24.04 hosted artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifact:
    name: Build amd64 Debian artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Prepare artifact directories
        id: paths
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/wildbuzzard-hosted-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "${release_root}/artifacts" "${release_root}/logs" "${release_root}/work"
          echo "WILDBUZZARD_RELEASE_ROOT=${release_root}" >>"${GITHUB_ENV}"
          echo "release_root=${release_root}" >>"${GITHUB_OUTPUT}"

      - name: Reclaim hosted runner disk
        run: |
          set -Eeuo pipefail
          disk_log="${WILDBUZZARD_RELEASE_ROOT}/logs/host-disk.txt"
          {
            echo "Before cleanup"
            df -h
          } | tee "${disk_log}"

          package_patterns=(
            azure-cli
            cabal-install
            'dotnet-*'
            firefox
            ghc
            google-chrome-stable
            google-cloud-cli
            microsoft-edge-stable
            'mono-*'
            'mysql-*'
            'openjdk-*-jdk*'
            'postgresql-*'
            powershell
            'temurin-*'
            'clang-*'
            'llvm-*'
          )
          for pattern in "${package_patterns[@]}"; do
            mapfile -t packages < <(
              dpkg-query --show --showformat='${db:Status-Abbrev} ${binary:Package}\n' \
                "${pattern}" 2>/dev/null |
                awk '$1 == "ii" { print $2 }' || true
            )
            if ((${#packages[@]})) &&
              ! sudo apt-get purge --yes "${packages[@]}"; then
              echo "Warning: could not purge package pattern ${pattern}" | tee -a "${disk_log}"
            fi
          done

          remove_path() {
            local target="$1"
            if sudo test -e "${target}" &&
              ! sudo rm -rf --one-file-system -- "${target}"; then
              echo "Warning: could not remove ${target}" | tee -a "${disk_log}"
            fi
          }

          cleanup_paths=(
            /opt/az
            /opt/ghc
            /opt/google
            /opt/hostedtoolcache
            /opt/microsoft
            /opt/pipx
            /usr/local/aws-cli
            /usr/local/aws-sam-cli
            /usr/local/.ghcup
            /usr/local/lib/android
            /usr/local/lib/node_modules
            /usr/local/share/boost
            /usr/local/share/chromium
            /usr/local/share/powershell
            /usr/local/share/vcpkg
            /usr/local/swift
            /usr/share/dotnet
            /usr/share/miniconda
            /usr/share/swift
          )
          for target in "${cleanup_paths[@]}"; do
            remove_path "${target}"
          done
          while IFS= read -r -d '' target; do
            remove_path "${target}"
          done < <(sudo find /usr/local -mindepth 1 -maxdepth 1 -type d -name 'julia*' -print0 2>/dev/null || true)

          sudo apt-get clean || echo "Warning: apt cache cleanup did not complete" | tee -a "${disk_log}"
          sudo rm -rf --one-file-system -- /var/lib/apt/lists/* /var/cache/apt/archives/* ||
            echo "Warning: apt metadata cleanup did not complete" | tee -a "${disk_log}"

          {
            echo "After cleanup"
            df -h
          } | tee -a "${disk_log}"

      - name: Checkout WildBuzzard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source/wildbuzzard
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare direct browser toolchain
        run: |
          set -Eeuo pipefail
          source_root="${GITHUB_WORKSPACE}/source/wildbuzzard"
          arti_commit="$(
            awk -F' = ' '$1 == "commit" { gsub(/^"|"$/, "", $2); print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml"
          )"
          arti_rust="$(
            awk -F' = ' '$1 == "build_rustc" { print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml" |
              sed -E 's/^"rustc ([0-9.]+).*/\1/'
          )"
          git -C "${source_root}" fetch --no-tags --depth=1 origin "${arti_commit}"
          rustup toolchain install "${arti_rust}" --profile minimal
          rustup default "${arti_rust}"
          export MOZBUILD_STATE_PATH="${WILDBUZZARD_RELEASE_ROOT}/work/browser/state"
          cd -- "${source_root}"
          ./mach --no-interactive bootstrap --application-choice browser \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/bootstrap.log"

      - name: Build, test, and package directly on Ubuntu 24.04
        run: |
          set -Eeuo pipefail
          export CI=1
          export MOZBUILD_STATE_PATH="${WILDBUZZARD_RELEASE_ROOT}/work/browser/state"
          "${GITHUB_WORKSPACE}/source/wildbuzzard/wildbuzzard/ci/build-browser-artifact.sh" \
            --wildbuzzard "${GITHUB_WORKSPACE}/source/wildbuzzard" \
            --commit "${GITHUB_SHA}" \
            --work-dir "${WILDBUZZARD_RELEASE_ROOT}/work" \
            --artifact-dir "${WILDBUZZARD_RELEASE_ROOT}/artifacts" \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/browser-build.log"

      - name: Upload WildBuzzard Debian artifact and evidence
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-amd64-deb-${{ github.sha }}
          path: |
            ${{ steps.paths.outputs.release_root }}/artifacts/wildbuzzard_*_amd64.deb
            ${{ steps.paths.outputs.release_root }}/artifacts/*-build-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/browser-artifact-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload build logs
        if: always() && steps.paths.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-hosted-build-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.release_root }}/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
