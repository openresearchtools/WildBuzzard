name: WildBuzzard Ubuntu 24.04 browser artifact

on:
  workflow_dispatch:
    inputs:
      arti_run_id:
        description: Successful WildBuzzard Arti workflow run ID
        required: true
        type: string
      arti_artifact_name:
        description: Arti artifact name from that run
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  browser:
    name: Build amd64 Debian artifact
    runs-on: ubuntu-24.04
    env:
      SCCACHE_GHA_ENABLED: "true"
      WILDBUZZARD_BUILD_JOBS: "1"
    steps:
      - name: Prepare artifact directories
        id: paths
        run: |
          set -Eeuo pipefail
          release_root="${RUNNER_TEMP}/wildbuzzard-browser-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mkdir -p -- "${release_root}/arti-input" "${release_root}/artifacts" "${release_root}/logs" "${release_root}/work"
          echo "WILDBUZZARD_RELEASE_ROOT=${release_root}" >>"${GITHUB_ENV}"
          echo "release_root=${release_root}" >>"${GITHUB_OUTPUT}"

      - name: Free runner disk space
        run: |
          set -Eeuo pipefail
          df -h /
          unused_paths=(
            /usr/local/lib/android
            /usr/share/dotnet
            /opt/ghc
            /usr/local/.ghcup
            /opt/hostedtoolcache/CodeQL
            /opt/hostedtoolcache/go
            /opt/hostedtoolcache/PyPy
            /opt/hostedtoolcache/Ruby
            /usr/local/share/boost
          )
          for path in "${unused_paths[@]}"; do
            if [[ -e "${path}" ]]; then
              sudo rm -rf --one-file-system -- "${path}"
            fi
          done
          if command -v docker >/dev/null 2>&1 && sudo docker info >/dev/null 2>&1; then
            sudo docker system prune --all --force
          fi
          sudo apt-get clean
          sudo find /var/lib/apt/lists -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +
          sudo fallocate --length 8G /mnt/wildbuzzard-build.swap
          sudo chmod 0600 /mnt/wildbuzzard-build.swap
          sudo mkswap /mnt/wildbuzzard-build.swap
          sudo swapon /mnt/wildbuzzard-build.swap
          df -h /
          free -h
          swapon --show

      - name: Checkout WildBuzzard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source/wildbuzzard
          fetch-depth: 1
          persist-credentials: false

      - name: Download pinned Arti runtime
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.arti_artifact_name }}
          path: ${{ steps.paths.outputs.release_root }}/arti-input
          repository: ${{ github.repository }}
          run-id: ${{ inputs.arti_run_id }}
          github-token: ${{ github.token }}

      - name: Enable resumable compiler cache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba # v0.0.11
        with:
          version: v0.17.0

      - name: Prepare browser toolchain
        run: |
          set -Eeuo pipefail
          source_root="${GITHUB_WORKSPACE}/source/wildbuzzard"
          browser_work="${GITHUB_WORKSPACE}/.wildbuzzard-build"
          arti_rust="$(
            awk -F' = ' '$1 == "build_rustc" { print $2 }' \
              "${source_root}/wildbuzzard/third_party/arti.toml" |
              sed -E 's/^"rustc ([0-9.]+).*/\1/'
          )"
          chmod 0755 "${WILDBUZZARD_RELEASE_ROOT}/arti-input/arti"
          rustup toolchain install "${arti_rust}" --profile minimal
          rustup default "${arti_rust}"
          export MOZBUILD_STATE_PATH="${browser_work}/browser/state"
          cd -- "${source_root}"
          ./mach --no-interactive bootstrap --application-choice browser \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/bootstrap.log"

      - name: Build and package directly on Ubuntu 24.04
        run: |
          set -Eeuo pipefail
          export CI=1
          export MOZBUILD_STATE_PATH="${GITHUB_WORKSPACE}/.wildbuzzard-build/browser/state"
          export WILDBUZZARD_BUILD_RUN_ID=hosted
          "${GITHUB_WORKSPACE}/source/wildbuzzard/wildbuzzard/ci/build-browser-artifact.sh" \
            --wildbuzzard "${GITHUB_WORKSPACE}/source/wildbuzzard" \
            --commit "${GITHUB_SHA}" \
            --work-dir "${GITHUB_WORKSPACE}/.wildbuzzard-build" \
            --artifact-dir "${WILDBUZZARD_RELEASE_ROOT}/artifacts" \
            --arti-dir "${WILDBUZZARD_RELEASE_ROOT}/arti-input" \
            2>&1 | tee "${WILDBUZZARD_RELEASE_ROOT}/logs/browser-build.log"

      - name: Upload WildBuzzard Debian artifact and evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-amd64-deb-${{ github.sha }}
          path: |
            ${{ steps.paths.outputs.release_root }}/artifacts/wildbuzzard_*_amd64.deb
            ${{ steps.paths.outputs.release_root }}/artifacts/*-build-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/browser-artifact-manifest.txt
            ${{ steps.paths.outputs.release_root }}/artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

      - name: Upload browser build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wildbuzzard-browser-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ steps.paths.outputs.release_root }}/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/logs/**
            ${{ steps.paths.outputs.release_root }}/work/**/*.log
          if-no-files-found: warn
          compression-level: 6
          retention-days: 7
