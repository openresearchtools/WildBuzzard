[package]
name = "wildbuzzard-browser-runner"
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"

[dependencies]
rquickjs = { version = "=0.12.1", default-features = false, features = ["std", "futures", "parallel"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tokio = { version = "=1.52.0", features = ["io-std", "io-util", "macros", "rt-multi-thread", "sync", "time"] }

[profile.release]
codegen-units = 1
lto = "thin"
strip = true

[workspace]
