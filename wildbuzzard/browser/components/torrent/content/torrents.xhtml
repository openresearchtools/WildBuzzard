<?xml version="1.0"?>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="wildbuzzard-torrents-page-title"></title>
    <link rel="localization" href="browser/wildbuzzardTorrent.ftl" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/torrents/torrents.css"
    />
    <script
      defer="defer"
      src="chrome://browser/content/torrents/torrents.js"
    ></script>
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow" data-l10n-id="wildbuzzard-torrents-product"></p>
        <h1 data-l10n-id="wildbuzzard-torrents-heading"></h1>
        <p class="subtitle" data-l10n-id="wildbuzzard-torrents-subtitle"></p>
      </div>
      <div
        id="engine-capabilities"
        class="capabilities"
        aria-live="polite"
      ></div>
    </header>

    <main>
      <section class="add-card" aria-labelledby="add-heading">
        <div class="section-heading">
          <div>
            <h2
              id="add-heading"
              data-l10n-id="wildbuzzard-torrents-add-heading"
            ></h2>
            <p data-l10n-id="wildbuzzard-torrents-add-description"></p>
          </div>
          <button
            id="choose-torrent"
            class="secondary"
            data-l10n-id="wildbuzzard-torrents-choose-file"
          ></button>
        </div>
        <form id="add-form">
          <label
            for="torrent-source"
            data-l10n-id="wildbuzzard-torrents-source-label"
          ></label>
          <div class="input-row">
            <input
              id="torrent-source"
              type="url"
              spellcheck="false"
              data-l10n-id="wildbuzzard-torrents-source-input"
            />
            <button
              type="submit"
              class="primary"
              data-l10n-id="wildbuzzard-torrents-add-button"
            ></button>
          </div>
        </form>
        <div
          id="drop-target"
          tabindex="0"
          data-l10n-id="wildbuzzard-torrents-drop-target"
        ></div>
        <div class="network-notice" role="note">
          <span class="notice-icon" aria-hidden="true"></span>
          <span
            id="tor-notice"
            data-l10n-id="wildbuzzard-torrents-tor-notice"
          ></span>
        </div>
      </section>

      <section
        id="summary"
        class="summary-grid"
        data-l10n-id="wildbuzzard-torrents-summary-label"
      ></section>

      <section class="client-layout" aria-labelledby="downloads-heading">
        <div class="torrent-list-panel">
          <div class="section-heading list-heading">
            <div>
              <h2
                id="downloads-heading"
                data-l10n-id="wildbuzzard-torrents-list-heading"
              ></h2>
              <p id="download-directory"></p>
            </div>
            <button
              id="choose-directory"
              class="secondary"
              data-l10n-id="wildbuzzard-torrents-change-directory"
            ></button>
          </div>
          <div id="torrent-list" class="torrent-list"></div>
          <div id="empty-state" class="empty-state" hidden="hidden">
            <div class="empty-icon" aria-hidden="true"></div>
            <h3 data-l10n-id="wildbuzzard-torrents-empty-heading"></h3>
            <p data-l10n-id="wildbuzzard-torrents-empty-description"></p>
          </div>
        </div>

        <aside
          id="details"
          class="details-panel"
          aria-labelledby="details-heading"
        >
          <div id="details-empty" class="details-empty">
            <h2
              id="details-heading"
              data-l10n-id="wildbuzzard-torrents-details-heading"
            ></h2>
            <p data-l10n-id="wildbuzzard-torrents-details-empty"></p>
          </div>
          <div id="details-content" hidden="hidden"></div>
        </aside>
      </section>

      <section class="settings-card" aria-labelledby="settings-heading">
        <div class="section-heading">
          <div>
            <h2
              id="settings-heading"
              data-l10n-id="wildbuzzard-torrents-settings-heading"
            ></h2>
            <p data-l10n-id="wildbuzzard-torrents-settings-description"></p>
          </div>
        </div>
        <form id="settings-form" class="settings-grid">
          <label>
            <span data-l10n-id="wildbuzzard-torrents-max-active"></span>
            <input id="max-active" type="number" min="1" max="50" />
          </label>
          <label>
            <span data-l10n-id="wildbuzzard-torrents-download-limit"></span>
            <input id="download-limit" type="number" min="-1" step="1" />
          </label>
          <label>
            <span data-l10n-id="wildbuzzard-torrents-upload-limit"></span>
            <input id="upload-limit" type="number" min="-1" step="1" />
          </label>
          <label class="checkbox-row">
            <input id="seed-completed" type="checkbox" />
            <span data-l10n-id="wildbuzzard-torrents-seed-completed"></span>
          </label>
          <label class="checkbox-row">
            <input id="tor-enabled" type="checkbox" />
            <span data-l10n-id="wildbuzzard-torrents-tor-enabled"></span>
          </label>
          <button
            type="submit"
            class="primary"
            data-l10n-id="wildbuzzard-torrents-save-settings"
          ></button>
        </form>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite" hidden="hidden"></div>
  </body>
</html>
