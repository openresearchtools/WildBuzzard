<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <title data-l10n-id="wildbuzzard-search-page-title"></title>
    <link rel="localization" href="browser/wildbuzzardSearch.ftl" />
    <link rel="stylesheet" href="chrome://global/skin/in-content/common.css" />
    <link
      rel="stylesheet"
      href="chrome://browser/content/searxng/searxng.css"
    />
    <script
      defer="defer"
      src="chrome://browser/content/searxng/searxng.js"
    ></script>
  </head>
  <body>
    <header>
      <p class="eyebrow" data-l10n-id="wildbuzzard-search-product"></p>
      <h1 data-l10n-id="wildbuzzard-search-heading"></h1>
      <p class="subtitle" data-l10n-id="wildbuzzard-search-subtitle"></p>
    </header>
    <main>
      <form id="search-form">
        <input
          id="search-query"
          name="q"
          type="search"
          maxlength="512"
          required="required"
          autofocus="autofocus"
          data-l10n-id="wildbuzzard-search-input"
        />
        <button
          id="search-submit"
          type="submit"
          class="primary"
          data-l10n-id="wildbuzzard-search-submit"
        ></button>
        <button
          id="search-cancel"
          type="button"
          hidden="hidden"
          data-l10n-id="wildbuzzard-search-cancel"
        ></button>
      </form>
      <div id="search-status" role="status" aria-live="polite"></div>
      <section id="answers" hidden="hidden" aria-label="Answers"></section>
      <ol id="search-results"></ol>
      <button
        id="next-page"
        type="button"
        hidden="hidden"
        data-l10n-id="wildbuzzard-search-next"
      ></button>
    </main>
  </body>
</html>
