<vbox id="browser-bottombox">
  <html:link rel="stylesheet" href="chrome://browser/content/wildbuzzard/statusbar/statusbar.css"/>
  <toolbar id="status-bar"
           class="chrome-block"
           customizable="true"
           context="toolbar-context-menu"
           mode="icons"
           collapsed="true">
    <toolbaritem id="status-text"
                 data-l10n-id="wildbuzzard-status-bar-text"
                 data-l10n-attrs="label"
                 flex="1"/>
  </toolbar>
</vbox>
