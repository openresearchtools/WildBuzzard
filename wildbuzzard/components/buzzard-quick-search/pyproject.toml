[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "buzzard-quick-search"
version = "0.1.0"
description = "Standalone Unsloth-compatible web search CLI and MCP server"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-only" }
dependencies = [
  "ddgs==9.14.4",
  "pymupdf==1.27.2.3",
  "pymupdf4llm==0.3.4",
]

[project.scripts]
buzzard-quick-search = "buzzard_quick_search.cli:main"
buzzard-quick-search-mcp = "buzzard_quick_search.mcp_server:main"

[dependency-groups]
build = ["pyinstaller==6.16.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/buzzard_quick_search"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "THIRD_PARTY_NOTICES.md"]
